
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Inter, Arial, sans-serif">
  <rect width="1080" height="1350" fill="#0B1220"/>

  <!-- Header -->
  <text x="60" y="118" font-size="72" font-weight="700" fill="#E8EEF8"><tspan fill="#4F8CFF">Data Lake</tspan> vs</text>
  <text x="60" y="198" font-size="72" font-weight="700" fill="#2DD4BF">Data Warehouse</text>
  <text x="60" y="252" font-size="36" fill="#8DA2BF">Where should data live?</text>

  <!-- Sources row -->
  <g>
    <rect x="60" y="290" width="180" height="140" rx="18" fill="#131C30"/>
    <rect x="255" y="290" width="180" height="140" rx="18" fill="#131C30"/>
    <rect x="450" y="290" width="180" height="140" rx="18" fill="#131C30"/>
    <rect x="645" y="290" width="180" height="140" rx="18" fill="#131C30"/>
    <rect x="840" y="290" width="180" height="140" rx="18" fill="#131C30"/>

    <g fill="none" stroke="#8DA2BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <!-- Orders: package -->
      <g transform="translate(134,306)">
        <path d="M4 9 L16 3 L28 9 L28 23 L16 29 L4 23 Z M4 9 L16 15 L28 9 M16 15 L16 29"/>
      </g>
      <!-- Customers: person -->
      <g transform="translate(329,306)">
        <circle cx="16" cy="10" r="5.5"/>
        <path d="M6 29 C6 19 26 19 26 29"/>
      </g>
      <!-- Payments: card -->
      <g transform="translate(524,306)">
        <rect x="3" y="7" width="26" height="18" rx="3"/>
        <path d="M3 13 H29 M8 20 H14"/>
      </g>
      <!-- Clicks: cursor -->
      <g transform="translate(719,306)">
        <path d="M8 4 L8 26 L13 21 L17 29 L21 27 L17 19 L24 19 Z"/>
      </g>
      <!-- Logs: document -->
      <g transform="translate(914,306)">
        <rect x="6" y="3" width="20" height="26" rx="3"/>
        <path d="M11 11 H21 M11 17 H21 M11 23 H17"/>
      </g>
    </g>

    <g font-size="30" font-weight="600" fill="#E8EEF8" text-anchor="middle">
      <text x="150" y="372">Orders</text>
      <text x="345" y="372">Customers</text>
      <text x="540" y="372">Payments</text>
      <text x="735" y="372">Clicks</text>
      <text x="930" y="372">Logs</text>
    </g>
    <g font-size="30" fill="#8DA2BF" text-anchor="middle">
      <text x="150" y="410">Postgres</text>
      <text x="345" y="410">Salesforce</text>
      <text x="540" y="410">API</text>
      <text x="735" y="410">Kafka</text>
      <text x="930" y="410">JSON</text>
    </g>
  </g>

  <!-- Branch arrows -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M540 430 V452" stroke="#8DA2BF"/>
    <path d="M540 452 H300 V484" stroke="#4F8CFF"/>
    <path d="M540 452 H1000 V933 H994" stroke="#2DD4BF"/>
  </g>
  <polygon points="288,484 312,484 300,498" fill="#4F8CFF"/>
  <polygon points="994,922 994,944 982,933" fill="#2DD4BF"/>

  <!-- Lane 1: Data Lake -->
  <g transform="translate(0,500)">
    <rect x="60" y="0" width="920" height="274" rx="24" fill="#131C30" stroke="#4F8CFF" stroke-width="2"/>
    <text x="84" y="54" font-size="36" font-weight="700" fill="#4F8CFF" letter-spacing="1">DATA LAKE</text>
    <text x="84" y="94" font-size="30" fill="#8DA2BF">Keep everything</text>

    <rect x="680" y="16" width="276" height="46" rx="23" fill="#4F8CFF" fill-opacity="0.14" stroke="#4F8CFF" stroke-width="2"/>
    <text x="818" y="49" font-size="30" fill="#4F8CFF" text-anchor="middle">Schema on read</text>

    <g fill="#0B1220" stroke="#4F8CFF" stroke-width="2">
      <rect x="84" y="112" width="264" height="76" rx="14"/>
      <rect x="388" y="112" width="264" height="76" rx="14"/>
      <rect x="692" y="112" width="264" height="76" rx="14"/>
    </g>
    <g font-size="30" font-weight="600" fill="#E8EEF8" text-anchor="middle">
      <text x="216" y="161">Raw files</text>
      <text x="520" y="161">Process</text>
      <text x="824" y="161" textLength="236" lengthAdjust="spacingAndGlyphs">ML / Exploration</text>
    </g>
    <g stroke="#4F8CFF" stroke-width="3" stroke-linecap="round">
      <path d="M354 150 H378"/>
      <path d="M658 150 H682"/>
    </g>
    <polygon points="376,140 376,160 386,150" fill="#4F8CFF"/>
    <polygon points="680,140 680,160 690,150" fill="#4F8CFF"/>

    <rect x="84" y="208" width="410" height="46" rx="23" fill="#F5B73B" fill-opacity="0.14" stroke="#F5B73B" stroke-width="2"/>
    <text x="289" y="241" font-size="30" fill="#F5B73B" text-anchor="middle">No governance = swamp</text>
  </g>

  <!-- Lane 2: Data Warehouse -->
  <g transform="translate(0,796)">
    <rect x="60" y="0" width="920" height="274" rx="24" fill="#131C30" stroke="#2DD4BF" stroke-width="2"/>
    <text x="84" y="54" font-size="36" font-weight="700" fill="#2DD4BF" letter-spacing="1">DATA WAREHOUSE</text>
    <text x="84" y="94" font-size="30" fill="#8DA2BF">Serve the business</text>

    <rect x="680" y="16" width="276" height="46" rx="23" fill="#2DD4BF" fill-opacity="0.14" stroke="#2DD4BF" stroke-width="2"/>
    <text x="818" y="49" font-size="30" fill="#2DD4BF" text-anchor="middle">Schema on write</text>

    <g fill="#0B1220" stroke="#2DD4BF" stroke-width="2">
      <rect x="84" y="112" width="264" height="76" rx="14"/>
      <rect x="388" y="112" width="264" height="76" rx="14"/>
      <rect x="692" y="112" width="264" height="76" rx="14"/>
    </g>
    <g font-size="30" font-weight="600" fill="#E8EEF8" text-anchor="middle">
      <text x="216" y="161">Transform</text>
      <text x="520" y="161">Modeled tables</text>
      <text x="824" y="161">BI dashboards</text>
    </g>
    <g stroke="#2DD4BF" stroke-width="3" stroke-linecap="round">
      <path d="M354 150 H378"/>
      <path d="M658 150 H682"/>
    </g>
    <polygon points="376,140 376,160 386,150" fill="#2DD4BF"/>
    <polygon points="680,140 680,160 690,150" fill="#2DD4BF"/>

    <g font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="30" fill="#2DD4BF" text-anchor="middle">
      <rect x="146" y="208" width="234" height="46" rx="12" fill="#0B1220" stroke="#2DD4BF" stroke-width="2"/>
      <text x="263" y="241">fact_orders</text>
      <rect x="394" y="208" width="252" height="46" rx="12" fill="#0B1220" stroke="#2DD4BF" stroke-width="2"/>
      <text x="520" y="241">dim_customer</text>
      <rect x="660" y="208" width="234" height="46" rx="12" fill="#0B1220" stroke="#2DD4BF" stroke-width="2"/>
      <text x="777" y="241">daily_sales</text>
    </g>
  </g>

  <!-- Bottom bar -->
  <rect x="60" y="1096" width="920" height="140" rx="24" fill="#131C30"/>
  <g fill="none" stroke="#8DA2BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Preserve: cylinder -->
    <g transform="translate(84,1124)">
      <ellipse cx="14" cy="6" rx="9" ry="3.5"/>
      <path d="M5 6 V22 C5 26 23 26 23 22 V6 M5 14 C5 18 23 18 23 14"/>
    </g>
    <!-- Consumes: person -->
    <g transform="translate(377,1124)">
      <circle cx="14" cy="8" r="5"/>
      <path d="M4 27 C4 18 24 18 24 27"/>
    </g>
    <!-- Workloads: bars -->
    <g transform="translate(654,1124)">
      <path d="M5 24 V13 M14 24 V4 M23 24 V17"/>
    </g>
  </g>
  <g font-size="30" font-weight="500" fill="#E8EEF8">
    <text x="122" y="1148" textLength="231" lengthAdjust="spacingAndGlyphs">Preserve what?</text>
    <text x="415" y="1148" textLength="215" lengthAdjust="spacingAndGlyphs">Who consumes?</text>
    <text x="692" y="1148" textLength="264" lengthAdjust="spacingAndGlyphs">Which workloads?</text>
  </g>
  <path d="M84 1170 H956" stroke="#24314D" stroke-width="2"/>
  <text x="520" y="1214" font-size="30" font-weight="700" fill="#E8EEF8" text-anchor="middle">Often: both (Lakehouse)</text>

  <!-- Handle -->
  <text x="980" y="1290" font-size="30" fill="#8DA2BF" text-anchor="end">@yourhandle</text>
</svg>